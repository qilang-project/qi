name: CI

on:
  push:
    # win-完整性：Windows 三套验收（FFI 链接 / C 回调 / 调试信息）的迭代分支。
    # 合并回 main 之前可以删掉这一项。
    branches: [main, master, develop, "feat-*", "win-完整性"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build + Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # inkwell needs LLVM 21. macOS ships clang; on Linux install via apt.
      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lsb-release wget software-properties-common gnupg libssl-dev libsqlite3-dev pkg-config
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libpolly-21-dev libzstd-dev libxml2-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
          # qi 生成的是不透明指针(ptr) IR；装 clang-17 专供编译 .ll（独立工具，与构建 qi 用的 LLVM 21 无关），
          # 把 `clang` 指向它。
          sudo ./llvm.sh 17
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 200

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> $GITHUB_ENV

      # 被测依赖：qi-runtime 提供示例链接用的归档（独立仓）。
      # 克隆到 ../ 是因为 qi-runtime 自己按 ../qi-gui 找 GUI 的 manifest；
      # Makefile 的 RUNTIME_DIR 默认就是 ../qi-runtime，本地和这里一致。
      #
      # **runtime 用 main 不钉 tag**：这是 CI 不是发布，要的就是「最新的
      # 编译器配最新的运行时」能不能一起跑。钉 tag 的话，运行时刚加的符号
      # 在 CI 里根本测不到 —— 发布那条路才需要可复现（见 release.yml）。
      - name: Clone 被测依赖
        run: |
          git clone --depth 1 --branch 2026.07.24-1 https://github.com/qilang-project/qi-gui.git ../qi-gui
          git clone --depth 1 https://github.com/qilang-project/qi-runtime.git ../qi-runtime
          git clone --depth 1 https://github.com/qilang-project/qi-grpc.git ../qi-grpc

      # gRPC 互通验收要 Go（对照客户端/服务端走 protoc 生成的静态桩，
      # 桩已入库所以不用装 protoc）。没有 Go 时 跑验收.sh 会自己跳过 Go 那半边。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # 构建 + 单测 + codegen 回归 + 示例冒烟，全部走 Makefile ——
      # 和本地 make ci 是同一条路径，避免两边各写一份逐渐漂移
      # （之前示例冒烟一直挂在「找不到 qi-runtime 归档」，就是 CI 这边把
      #  归档放在了编译器找不到的位置，本地却没这个问题）。
      - name: make ci
        run: make ci

  build-windows:
    name: Build + Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 官方 clang+llvm msvc 包(含 llvm-config.exe 与静态库)——choco 的官方安装器
      # 缺 llvm-config/静态库,llvm-sys 探测必败(此前 15.x 同因烂掉)。
      - name: Install LLVM 21 (Windows)
        shell: pwsh
        run: |
          # PLC-lang 的 LLVM Windows 包 —— 专为 llvm-sys/inkwell CI 打造。
          # 官方 clang+llvm msvc 包有两个死穴:内嵌 rpmalloc(与 ucrt 的 malloc/free
          # LNK2005 冲突)+ 部分 target 库链接不全(LLVMInitializeMips* LNK2019)。
          curl.exe -L -o llvm.7z https://github.com/PLC-lang/llvm-package-windows/releases/download/v21.1.7/LLVM-21.1.7-win64.7z
          7z x llvm.7z -oC:\LLVM21
          $prefix = if (Test-Path "C:\LLVM21\bin") { "C:\LLVM21" } else { (Get-ChildItem C:\LLVM21 -Directory | Select-Object -First 1).FullName }
          echo "LLVM_SYS_211_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          # 链接与验收要用到同一套 LLVM 的 clang / llvm-lib / llvm-dwarfdump。
          # 放到 PATH **最前面**：runner 自带的 clang 版本不定，dwarfdump 更是可能没有。
          echo "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Library unit tests
        run: cargo test --release --lib --verbose

      # ── 以下三套（FFI 链接 / C 回调 / DWARF 调试信息）此前只在 mac+Linux 跑过 ──
      # 它们都要**真链出可执行文件再跑**，所以 Windows 上得先有 qi-runtime 归档
      # （MSVC 下叫 qi_runtime.lib，不是 libqi_runtime.a）。
      #
      # 用 shell: bash（windows runner 自带 git-bash）复用同一份 .sh 脚本 ——
      # 与其给 Windows 另写一份 PowerShell 断言，不如让脚本里带平台分支，
      # 三个平台的契约就只有一处定义。

      # qi-runtime 是独立仓；跟 Build + Test job 一样用 main（CI 要的是
      # 「最新编译器 + 最新运行时」，钉 tag 是发布那条路的事）。
      # qi-gui 必须同级 clone：runtime 的 gui feature 声明了 optional path 依赖，
      # cargo 即使不启用该 feature 也要读它的 manifest。
      - name: Clone + build qi-runtime
        shell: bash
        run: |
          git clone --depth 1 --branch 2026.07.24-1 https://github.com/qilang-project/qi-gui.git ../qi-gui
          git clone --depth 1 https://github.com/qilang-project/qi-runtime.git ../qi-runtime
          cargo build --release --manifest-path ../qi-runtime/Cargo.toml
          # 归档路径要给 qi.exe（原生程序）读，必须是 Windows 形式的路径：
          # MSYS 只转换命令行参数，**不转环境变量**，传 /d/a/... 过去它认不出。
          echo "QI_RUNTIME_LIB=$(cygpath -w "$PWD/../qi-runtime/target/release/qi_runtime.lib")" >> "$GITHUB_ENV"

      # 侦察：工具链有什么、qi 在 Windows 上到底产出什么。**永不失败**，
      # 它的产物是给人读的日志，不是断言。
      - name: 侦察 Windows 工具链与产物
        shell: bash
        continue-on-error: true
        run: bash tests/侦察Windows.sh target/release/qi.exe

      # 三套都是硬门禁（排错阶段挂过 continue-on-error，现已撤掉）。
      # DWARF 那套在 Windows 上会跳过「调试器端到端」一节 ——
      # 产物是 DWARF-in-COFF，Windows 调试器走 PDB/CodeView，脚本会打印理由。
      - name: FFI 链接控制
        shell: bash
        run: bash tests/ffi链接/断言.sh target/release/qi.exe

      - name: codegen 回归（含 C 回调）
        shell: bash
        run: bash tests/codegen回归/断言.sh target/release/qi.exe

      - name: DWARF 调试信息
        shell: bash
        run: bash tests/调试信息/断言.sh target/release/qi.exe

  clippy:
    name: Clippy (lib)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lsb-release wget software-properties-common gnupg libssl-dev libsqlite3-dev pkg-config
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libpolly-21-dev libzstd-dev libxml2-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
      - run: cargo clippy --lib  # 报告不阻塞：既有 ~600 lint 债务(多为 FFI 裸指针等故意模式)，待逐步清理后再收紧回 -D warnings

  # 格式检查**只在这一处**跑。Build + Test 那边用浮动 @stable，
  # 曾经也跑一遍(make check 里)，结果 stable 一升级就跟这儿的钉死版本
  # 打对台:新 rustfmt 要 `{元素类型, Qi类型}`，1.92.0 要 `{Qi类型, 元素类型}`
  # —— 中文标识符在 import 里的排序两版不同。现在 make check 只管 clippy，
  # 格式归这个 job（make fmt-check 是本地对应入口）。
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 钉死版本，且要与开发机一致。升这个版本号时先本地 cargo fmt 一遍再推。
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
