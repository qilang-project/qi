name: CI

on:
  push:
    branches: [main, master, develop, "feat-*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build + Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # inkwell needs LLVM 21. macOS ships clang; on Linux install via apt.
      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lsb-release wget software-properties-common gnupg libssl-dev libsqlite3-dev pkg-config
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
          # qi 生成的是不透明指针(ptr) IR；装 clang-17 专供编译 .ll（独立工具，与构建 qi 用的 LLVM 21 无关），
          # 把 `clang` 指向它。
          sudo ./llvm.sh 17
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 200

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> $GITHUB_ENV

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Library unit tests
        # The binary's test target has a pre-existing clap version mismatch;
        # library tests cover the actual compiler / parser / codegen modules.
        run: cargo test --release --lib --verbose

      - name: Smoke — stable examples
        # Curated stable examples; no LLM / network / GUI requirements.
        # See scripts/run_examples.sh for the list.
        run: bash scripts/run_examples.sh

  build-windows:
    name: Build + Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      # GitHub 的 windows runner 预装的 LLVM 版本不定（可能更新到 22.x）；inkwell 的 llvm21-1 需要 21.x，
      # 用 choco 显式钉住 21.1.8（choco 上 21.x 最新；--allow-downgrade --force 兼容预装版更高的情况，与 release.yml 一致）。
      - name: Install LLVM 21 (Windows)
        shell: pwsh
        run: |
          choco install -y llvm --version=21.1.8 --allow-downgrade --force
          echo "LLVM_SYS_211_PREFIX=C:\Program Files\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Library unit tests
        run: cargo test --release --lib --verbose

  clippy:
    name: Clippy (lib)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lsb-release wget software-properties-common gnupg libssl-dev libsqlite3-dev pkg-config
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
      - run: cargo clippy --lib  # 报告不阻塞：既有 ~600 lint 债务(多为 FFI 裸指针等故意模式)，待逐步清理后再收紧回 -D warnings

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # 固定到与本地一致的工具链版本，避免不同 stable rustfmt 版本格式化差异导致 --check 失败
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
