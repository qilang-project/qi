name: CI

on:
  push:
    branches: [main, master, develop, "feat-*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build + Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # inkwell needs LLVM 15. macOS ships clang; on Linux install via apt.
      - name: Install LLVM 15 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 15
          echo "LLVM_SYS_150_PREFIX=/usr/lib/llvm-15" >> $GITHUB_ENV

      - name: Install LLVM 15 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@15
          echo "LLVM_SYS_150_PREFIX=$(brew --prefix llvm@15)" >> $GITHUB_ENV

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Library unit tests
        # The binary's test target has a pre-existing clap version mismatch;
        # library tests cover the actual compiler / parser / codegen modules.
        run: cargo test --release --lib --verbose

      - name: Smoke — basic examples
        # Curated stable examples; no LLM/network/GUI requirements.
        run: |
          set -e
          QI=./target/release/qi
          for example in \
            示例/基础/格式字符串.qi \
            示例/基础/新功能演示.qi \
            示例/标准库/路径处理/路径示例.qi \
            示例/标准库/加密/加密.qi \
            示例/标准库/正则表达式/正则示例.qi \
          ; do
            if [ -f "$example" ]; then
              echo "::group::run $example"
              $QI run "$example"
              echo "::endgroup::"
            fi
          done

  clippy:
    name: Clippy (lib)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install LLVM 15
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 15
          echo "LLVM_SYS_150_PREFIX=/usr/lib/llvm-15" >> $GITHUB_ENV
      - run: cargo clippy --lib -- -D warnings

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
