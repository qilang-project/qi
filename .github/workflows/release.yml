name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: qi
            archive: qi-${{ github.ref_name }}-macos-arm64.tar.gz

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: qi
            archive: qi-${{ github.ref_name }}-macos-x64.tar.gz

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: qi
            archive: qi-${{ github.ref_name }}-linux-x64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qi.exe
            archive: qi-${{ github.ref_name }}-windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # qi-compiler links LLVM 21 via inkwell; each platform needs its own setup.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake build-essential \
            lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libpolly-21-dev libzstd-dev libxml2-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 官方 clang+llvm msvc 包(含 llvm-config.exe 与静态库)——choco 的官方安装器
          # 缺 llvm-config/静态库,llvm-sys 探测必败(此前 15.x 同因烂掉)。
          curl.exe -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz
          7z x llvm.tar.xz -so | 7z x -si -ttar -oC:\LLVM21
          echo "LLVM_SYS_211_PREFIX=C:\LLVM21\clang+llvm-21.1.8-x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} qi
          tar czf ${{ matrix.archive }} qi
          rm qi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.artifact }} qi.exe
          Compress-Archive -Path qi.exe -DestinationPath ${{ matrix.archive }}
          Remove-Item qi.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*

      - name: Trigger installer build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: qilang-project/qi-installer
          event-type: qi-released
          client-payload: '{"version": "${{ github.ref_name }}"}'
