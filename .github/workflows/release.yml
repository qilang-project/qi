name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: qi
            archive: qi-${{ github.ref_name }}-macos-arm64.tar.gz

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: qi
            archive: qi-${{ github.ref_name }}-linux-x64.tar.gz

          # linux-arm64。**不能交叉编译** —— llvm-sys 会去链宿主的 LLVM，
          # 交叉时抓到的是 x86 那份，直接 panic（Mac 上试过，抓 libz3.dylib）。
          # 所以用原生的 arm64 runner 跑，跟 x64 那条一模一样的配方。
          #
          # 加这条是因为 ARM 服务器（Graviton / Ampere）和 Apple Silicon 上
          # 没有原生包就只能靠 qemu 模拟跑容器，慢且别扭。
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: qi
            archive: qi-${{ github.ref_name }}-linux-arm64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qi.exe
            archive: qi-${{ github.ref_name }}-windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # qi-compiler links LLVM 21 via inkwell; each platform needs its own setup.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake build-essential \
            lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libpolly-21-dev libzstd-dev libxml2-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 官方 clang+llvm msvc 包(含 llvm-config.exe 与静态库)——choco 的官方安装器
          # 缺 llvm-config/静态库,llvm-sys 探测必败(此前 15.x 同因烂掉)。
          # PLC-lang 的 LLVM Windows 包 —— 专为 llvm-sys/inkwell CI 打造。
          # 官方 clang+llvm msvc 包有两个死穴:内嵌 rpmalloc(与 ucrt 的 malloc/free
          # LNK2005 冲突)+ 部分 target 库链接不全(LLVMInitializeMips* LNK2019)。
          curl.exe -L -o llvm.7z https://github.com/PLC-lang/llvm-package-windows/releases/download/v21.1.7/LLVM-21.1.7-win64.7z
          7z x llvm.7z -oC:\LLVM21
          $prefix = if (Test-Path "C:\LLVM21\bin") { "C:\LLVM21" } else { (Get-ChildItem C:\LLVM21 -Directory | Select-Object -First 1).FullName }
          echo "LLVM_SYS_211_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # 编译产物要链接的运行时归档(无 LLVM,独立仓)——没有它用户装了编译器也编不了程序
      - name: Build qi-runtime
        run: |
          # qi-runtime 的 gui feature 声明了 optional path 依赖 ../qi-gui——
          # cargo 即使不启用 feature 也要读 manifest,故必须同级 clone qi-gui
          git clone --depth 1 --branch 2026.08.16-1 https://github.com/qilang-project/qi-gui.git ../qi-gui
          git clone --depth 1 --branch 2026.09.06-1 https://github.com/qilang-project/qi-runtime.git ../qi-runtime
          # 走 Makefile：归档路径只在 RUNTIME_DIR 一处定义，和本地/CI 一致
          make runtime

      # wasm 版运行时归档：纯 Rust，任何宿主都能编 wasm32-wasip1 目标。装进 lib/qi/ 之后
      # `qi --target wasm compile` 开箱即用（编译器第一个候选就是 <prefix>/lib/qi/）。
      # 一份归档所有平台通用，但每个 job 自己编一份最省事 —— 不用跨 job 传 artifact。
      - name: Build qi-runtime (wasm32-wasip1)
        shell: bash
        run: |
          rustup target add wasm32-wasip1
          (cd ../qi-runtime/wasm && cargo build --release --target wasm32-wasip1)
          test -s ../qi-runtime/wasm/target/wasm32-wasip1/release/libqi_runtime_wasm.a

      # 布局 bin/ + lib/qi/ —— 与 installer 安装布局同构,解压即用
      # (find_host_runtime_library 按 <prefix>/lib/qi/<归档> 查找)
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg/bin pkg/lib/qi
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} pkg/bin/qi
          cp ../qi-runtime/target/release/libqi_runtime.a pkg/lib/qi/
          cp ../qi-runtime/wasm/target/wasm32-wasip1/release/libqi_runtime_wasm.a pkg/lib/qi/
          if [ "$RUNNER_OS" = "macOS" ]; then
            # 捆绑 homebrew 动态库(z3/zstd 等 LLVM 连带依赖)+ rpath 化,
            # 无 homebrew 的 mac 也能跑(与 qi-installer 同法)
            otool -L pkg/bin/qi | awk '/\/opt\/homebrew\//{print $1}' | while read -r dep; do
              base=$(basename "$dep")
              cp -f "$dep" "pkg/lib/qi/$base"
              install_name_tool -change "$dep" "@rpath/$base" pkg/bin/qi
            done
            install_name_tool -add_rpath /usr/local/lib/qi pkg/bin/qi 2>/dev/null || true
            install_name_tool -add_rpath @executable_path/../lib/qi pkg/bin/qi 2>/dev/null || true
            codesign --force -s - pkg/bin/qi 2>/dev/null || true
            if otool -L pkg/bin/qi | grep -q "/opt/homebrew/"; then
              echo "仍有 homebrew 动态依赖未处理"; otool -L pkg/bin/qi; exit 1
            fi
          fi
          tar czf ${{ matrix.archive }} -C pkg bin lib
          rm -rf pkg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path pkg\bin, pkg\lib\qi | Out-Null
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.artifact }} pkg\bin\qi.exe
          Copy-Item ..\qi-runtime\target\release\qi_runtime.lib pkg\lib\qi\
          Copy-Item ..\qi-runtime\wasm\target\wasm32-wasip1\release\libqi_runtime_wasm.a pkg\lib\qi\
          Compress-Archive -Path pkg\bin, pkg\lib -DestinationPath ${{ matrix.archive }}
          Remove-Item -Recurse -Force pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*

      - name: Trigger installer build
        # 可选自动化:通知 qi-installer 仓重打安装包。RELEASE_TOKEN 未配置时
        # 不应拖垮整个发布(产物在上一步已发出)。
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: qilang-project/qi-installer
          event-type: qi-released
          client-payload: '{"version": "${{ github.ref_name }}"}'

  # 往 microsoft/winget-pkgs 提这一版的更新 PR。
  #
  # 首次上架(New-Package)是手工提的 PR，要 moderator 审，卡了 17 天；
  # 之后的**更新** PR 走自动验证流水线，一般几十分钟自动合，所以值得自动化 ——
  # 手工提意味着总会忘(winget 上一度停在 2026.07.10-2，而 release 已到 07.29-2)。
  #
  # 前提:仓库 secret `WINGET_TOKEN` = classic PAT，只需勾 `public_repo`。
  # **fine-grained token 不行** —— 这个 action 要往 fork 推分支再开 PR，
  # 需要 classic 的 repo 级权限。fork(liliang-cn/winget-pkgs)要先存在。
  winget:
    name: Submit winget update
    needs: release
    runs-on: ubuntu-latest
    # 提到 job 级:`secrets` 不能出现在 job/step 的 if 里，而**步骤自己的** env
    # 也读不到自己那层的 env —— 只有 workflow/job 级的 env 在 if 里可见。
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # 没配 token 就静静跳过:winget 上架失败不该让一次发布看起来是红的
      - name: Publish to winget-pkgs
        if: ${{ env.WINGET_TOKEN != '' }}
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: qilang.qi
          # 默认只认 exe/msi/msix —— 我们发的是 zip 便携包(内嵌 bin\qi.exe)，
          # 必须显式给 regex，否则 action 找不到安装包直接失败。
          # NestedInstallerType/PortableCommandAlias 由上一版清单继承，不用重写。
          installers-regex: 'windows-x64\.zip$'
          # 默认是 github.repository_owner，也就是 qilang-project —— 但
          # winget-pkgs 的 fork 在个人账号 liliang-cn 名下(首次上架就是从那儿提的)，
          # 不写死会去找不存在的 qilang-project/winget-pkgs。
          fork-user: liliang-cn
          token: ${{ secrets.WINGET_TOKEN }}

  # 刷 Homebrew tap 的 formula(qilang-project/homebrew-qi)。
  #
  # 跟 winget 同一个毛病:手工刷就是会忘 —— tap 一度停在 2026.07.17-2。
  # 逻辑照抄 qi-installer/scripts/更新安装清单.sh 的 formula 部分(那个脚本
  # 还管着 qi-installer 仓里的本地副本，两处都留着，改正则记得同步)。
  #
  # 前提:secret `TAP_TOKEN` 需要对 qilang-project/homebrew-qi 有写权限。
  brew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Bump formula
        if: ${{ env.TAP_TOKEN != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo qilang-project/qi -D dl \
            --pattern "*macos-arm64.tar.gz" --pattern "*linux-x64.tar.gz"
          MAC=$(sha256sum "dl/qi-$TAG-macos-arm64.tar.gz" | cut -d' ' -f1)
          LINUX=$(sha256sum "dl/qi-$TAG-linux-x64.tar.gz" | cut -d' ' -f1)

          git clone --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/qilang-project/homebrew-qi" tap

          python3 - tap/Formula/qi.rb "$TAG" "$MAC" "$LINUX" <<'PY'
          import re, sys
          p, tag, mac, linux = sys.argv[1:5]
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'version "[^"]+"', f'version "{tag}"', s, count=1)
          # 版本号自己含连字符(2026.07.29-2)，所以不能用 [^-]+；
          # 用非贪婪 [^"]+? 匹配到平台后缀之前
          s = re.sub(r'download/[^/]+/qi-[^"]+?-macos-arm64\.tar\.gz',
                     f'download/{tag}/qi-{tag}-macos-arm64.tar.gz', s)
          s = re.sub(r'download/[^/]+/qi-[^"]+?-linux-x64\.tar\.gz',
                     f'download/{tag}/qi-{tag}-linux-x64.tar.gz', s)
          # 按平台就位替换 sha256:macOS 那行紧跟 macos-arm64 的 url，linux 同理
          s = re.sub(r'(macos-arm64\.tar\.gz"\n\s*sha256 ")[0-9a-f]+', r'\g<1>'+mac, s)
          s = re.sub(r'(linux-x64\.tar\.gz"\n\s*sha256 ")[0-9a-f]+', r'\g<1>'+linux, s)
          open(p, "w", encoding="utf-8").write(s)
          PY

          # 校验:三处都换到位了才推。正则悄悄没匹配上(比如以后 formula 换了写法)
          # 会推出一个「版本号是新的、sha256 还是旧的」的 formula —— 用户 brew
          # install 时才在校验和上炸，而且看不出原因。
          grep -qF "$MAC" tap/Formula/qi.rb
          grep -qF "$LINUX" tap/Formula/qi.rb
          grep -qF "version \"$TAG\"" tap/Formula/qi.rb
          grep -qF "download/$TAG/qi-$TAG-macos-arm64.tar.gz" tap/Formula/qi.rb
          grep -qF "download/$TAG/qi-$TAG-linux-x64.tar.gz" tap/Formula/qi.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "formula 已是 $TAG，无需改动"; exit 0; fi
          git commit -qam "qi $TAG"
          git push
