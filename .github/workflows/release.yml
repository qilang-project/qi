name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: qi
            archive: qi-${{ github.ref_name }}-macos-arm64.tar.gz

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: qi
            archive: qi-${{ github.ref_name }}-linux-x64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qi.exe
            archive: qi-${{ github.ref_name }}-windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # qi-compiler links LLVM 21 via inkwell; each platform needs its own setup.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake build-essential \
            lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libpolly-21-dev libzstd-dev libxml2-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 官方 clang+llvm msvc 包(含 llvm-config.exe 与静态库)——choco 的官方安装器
          # 缺 llvm-config/静态库,llvm-sys 探测必败(此前 15.x 同因烂掉)。
          # PLC-lang 的 LLVM Windows 包 —— 专为 llvm-sys/inkwell CI 打造。
          # 官方 clang+llvm msvc 包有两个死穴:内嵌 rpmalloc(与 ucrt 的 malloc/free
          # LNK2005 冲突)+ 部分 target 库链接不全(LLVMInitializeMips* LNK2019)。
          curl.exe -L -o llvm.7z https://github.com/PLC-lang/llvm-package-windows/releases/download/v21.1.7/LLVM-21.1.7-win64.7z
          7z x llvm.7z -oC:\LLVM21
          $prefix = if (Test-Path "C:\LLVM21\bin") { "C:\LLVM21" } else { (Get-ChildItem C:\LLVM21 -Directory | Select-Object -First 1).FullName }
          echo "LLVM_SYS_211_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # 编译产物要链接的运行时归档(无 LLVM,独立仓)——没有它用户装了编译器也编不了程序
      - name: Build qi-runtime
        run: |
          git clone --depth 1 https://github.com/qilang-project/qi-runtime.git qi-runtime
          cd qi-runtime && cargo build --release

      # 布局 bin/ + lib/qi/ —— 与 installer 安装布局同构,解压即用
      # (find_host_runtime_library 按 <prefix>/lib/qi/<归档> 查找)
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg/bin pkg/lib/qi
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} pkg/bin/qi
          cp qi-runtime/target/release/libqi_runtime.a pkg/lib/qi/
          if [ "$RUNNER_OS" = "macOS" ]; then
            # 捆绑 homebrew 动态库(z3/zstd 等 LLVM 连带依赖)+ rpath 化,
            # 无 homebrew 的 mac 也能跑(与 qi-installer 同法)
            otool -L pkg/bin/qi | awk '/\/opt\/homebrew\//{print $1}' | while read -r dep; do
              base=$(basename "$dep")
              cp -f "$dep" "pkg/lib/qi/$base"
              install_name_tool -change "$dep" "@rpath/$base" pkg/bin/qi
            done
            install_name_tool -add_rpath /usr/local/lib/qi pkg/bin/qi 2>/dev/null || true
            install_name_tool -add_rpath @executable_path/../lib/qi pkg/bin/qi 2>/dev/null || true
            codesign --force -s - pkg/bin/qi 2>/dev/null || true
            if otool -L pkg/bin/qi | grep -q "/opt/homebrew/"; then
              echo "仍有 homebrew 动态依赖未处理"; otool -L pkg/bin/qi; exit 1
            fi
          fi
          tar czf ${{ matrix.archive }} -C pkg bin lib
          rm -rf pkg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path pkg\bin, pkg\lib\qi | Out-Null
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.artifact }} pkg\bin\qi.exe
          Copy-Item qi-runtime\target\release\qi_runtime.lib pkg\lib\qi\
          Compress-Archive -Path pkg\bin, pkg\lib -DestinationPath ${{ matrix.archive }}
          Remove-Item -Recurse -Force pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*

      - name: Trigger installer build
        # 可选自动化:通知 qi-installer 仓重打安装包。RELEASE_TOKEN 未配置时
        # 不应拖垮整个发布(产物在上一步已发出)。
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: qilang-project/qi-installer
          event-type: qi-released
          client-payload: '{"version": "${{ github.ref_name }}"}'
